[project]
name = "shopmind"
version = "1.0.0"
description = "ShopMind — grounded support agent for a fictional store, built with LangGraph."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Helison Dias" }]

[tool.pytest.ini_options]
pythonpath = ["api"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["api", "tests"]
extend-exclude = [".venv", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["shopmind"]
